#@TYPE: Machine
#@NAME: amd-zynqmp
#@DESCRIPTION: Machine configuration for Zynq Ultrascale+ MPSoC

DEFAULTTUNE = "cortexa53"
require conf/machine/include/arm/armv8a/tune-cortexa53.inc

BSP_XILINX_DERIVED:append = " amd-zynqmp"
MACHINE_FEATURES += "ext3 pci usbgadget usbhost vfat keyboard network"
EXTRA_IMAGECMD:jffs2 = "--pad --no-cleanmarkers --eraseblock=128"

KERNEL_IMAGETYPE ?= "Image"
KERNEL_DEVICETREE:amd-zynqmp = "xilinx/zynqmp-zcu102-rev1.0.dtb xilinx/zynqmp-zcu102-rev1.0-canfd.dtb"

SERIAL_CONSOLE = "115200 ttyPS0"

# variables needed by xilinx-bootbin
PREFERRED_PROVIDER_virtual/boot-bin ??= "xilinx-bootbin"
SOC_FAMILY ?= "zynqmp"

PREFERRED_PROVIDER_virtual/kernel ??= "linux-yocto"
PREFERRED_VERSION_linux-yocto ?= "6.6%"
PREFERRED_VERSION_linux-yocto-rt ?= "6.6%"

MACHINE_EXTRA_RRECOMMENDS = " kernel-modules kernel-devicetree"
IMAGE_FSTYPES += "tar.bz2 wic wic.bmap"

# wic support
IMAGE_INSTALL:append = "kernel-devicetree kernel-image-image"
WKS_FILE ?= "zynqmp-sdimage.wks"
do_image_wic[depends] += "mtools-native:do_populate_sysroot dosfstools-native:do_populate_sysroot"
IMAGE_BOOT_FILES ?= "Image zynqmp-zcu102-rev1.0.dtb"

# multilib support
MULTILIBS ?= "${@bb.utils.contains('MACHINE_FEATURES', 'mali400', '', 'multilib:lib32', d)}"
DEFAULTTUNE:virtclass-multilib-lib32 ?= "armv7athf-neon"

UBOOT_ENTRYPOINT = "0x80000"
UBOOT_LOADADDRESS = "0x80000"

UBOOT_ELF="u-boot.elf"
UBOOT_ELF_SUFFIX ?= "elf"

UBOOT_MACHINE = "xilinx_zynqmp_virt_defconfig"
PREFERRED_PROVIDER_u-boot = "u-boot-xlnx"
NON_MULTILIB_RECIPES:append = " u-boot-xlnx"

XSERVER:append = " xf86-video-armsoc"
MACHINEOVERRIDES:prepend:amd-zynqmp = "mali400:zynqmp:zynqmp-eg:"
